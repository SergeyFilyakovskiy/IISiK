
[project]
name = "identity-service"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "grpcio>=1.84.1",
    "proto-generated",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "shared",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.uv.sources]
shared = { workspace = true }
proto-generated = { workspace = true }
