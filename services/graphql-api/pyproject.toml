[project]
name = "graphql-api"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "grpcio>=1.84.1",
    "httpx>=0.28.1",
    "proto-generated",
    "pydantic-settings>=2.16.1",
    "shared",
    "strawberry-graphql[fastapi]>=0.338.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.uv.sources]
shared = { workspace = true }
proto-generated = { workspace = true }
