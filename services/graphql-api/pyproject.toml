[project]
name = "graphql-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.1",
    "shared",
    "sqlalchemy[asyncio]>=2.1.6",
    "strawberry-graphql[fastapi]>=0.338.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.uv.sources]
shared = { workspace = true }
