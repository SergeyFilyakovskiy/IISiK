name: tutoring-platform

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  redis_cache_data:
  kafka_data:
  prometheus_data:
  grafana_data:

services:
  # ── API GATEWAY (EDGE) ─────────────────────────────────────
  traefik:
    image: traefik:latest
    restart: no
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Traefik Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/certificates:ro
    networks:
      - public
      - internal

  # ── GRAPHQL API GATEWAY (BFF) ──────────────────────────────
  graphql-api:
    build:
      context: .
      dockerfile: services/graphql-api/Dockerfile
    restart: no
    environment:
      - AUTH_SERVICE_URL=http://identity-service:8001
      - IDENTITY_GRPC_ADDRESS=identity-service:50051
      - CATALOG_GRPC_ADDRESS=catalog-service:50052
      - SCHEDULING_GRPC_ADDRESS=scheduling-service:50053
      - BOOKING_GRPC_ADDRESS=booking-service:50054
      - PAYMENT_GRPC_ADDRESS=payment-service:50055
      - REVIEW_GRPC_ADDRESS=review-service:50056
      - NOTIFICATION_GRPC_ADDRESS=notification-service:50057
      - ANALYTICS_GRPC_ADDRESS=analytics-service:50058
      - GRPC_TIMEOUT_SECONDS=5
    expose:
      - "4000"
    depends_on:
      identity-service: { condition: service_healthy }
      catalog-service: { condition: service_started }
      scheduling-service: { condition: service_started }
      booking-service: { condition: service_started }
      payment-service: { condition: service_started }
      review-service: { condition: service_started }
      notification-service: { condition: service_started }
      analytics-service: { condition: service_started }
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=tutoring-platform_internal"
      - "traefik.http.routers.graphql.rule=Host(`api.localhost`) && PathPrefix(`/graphql`)"
      - "traefik.http.routers.graphql.middlewares=cors-headers@file"
      - "traefik.http.services.graphql.loadbalancer.server.port=4000"

  # ── BACKEND MICROSERVICES (gRPC) ───────────────────────────

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    restart: no
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/identity_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TTL_MINUTES=5
      - JWT_REFRESH_TTL_DAYS=30
    expose:
      - "50051" # gRPC port
      - "8001"  # HTTP port (healthchecks/metrics)
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  catalog-service:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    restart: no
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/catalog_db
      - GRPC_PORT=50052
      - KAFKA_BROKERS=kafka:9092
      - CACHE_REDIS_URL=redis://redis-cache:6379/0
      - CACHE_TTL_SECONDS=60
    expose: ["50052"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis-cache: { condition: service_healthy }
    networks: [internal]

  scheduling-service:
    build:
      context: .
      dockerfile: services/scheduling-service/Dockerfile
    restart: no
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/scheduling_db
      - GRPC_PORT=50053
      - CATALOG_GRPC_ADDRESS=catalog-service:50052
      - KAFKA_BROKERS=kafka:9092
      - CACHE_REDIS_URL=redis://redis-cache:6379/0
      - CACHE_TTL_SECONDS=30
    expose: ["50053"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis-cache: { condition: service_healthy }
      catalog-service: { condition: service_started }
    networks: [internal]

  booking-service:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    restart: no
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/booking_db
      - GRPC_PORT=50054
      - SCHEDULING_GRPC_ADDRESS=scheduling-service:50053
      - PAYMENT_GRPC_ADDRESS=payment-service:50055
      - CATALOG_GRPC_ADDRESS=catalog-service:50052
      - KAFKA_BROKERS=kafka:9092
    expose: ["50054"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      scheduling-service: { condition: service_started }
      payment-service: { condition: service_started }
      catalog-service: { condition: service_started }
    networks: [internal]

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    restart: no
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/payment_db
      - GRPC_PORT=50055
      - KAFKA_BROKERS=kafka:9092
    expose: ["50055"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    networks: [internal]

  review-service:
    build:
      context: .
      dockerfile: services/review-service/Dockerfile
    restart: no
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/review_db
      - GRPC_PORT=50056
      - BOOKING_GRPC_ADDRESS=booking-service:50054
      - KAFKA_BROKERS=kafka:9092
    expose: ["50056"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      booking-service: { condition: service_started }
    networks: [internal]

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    restart: no
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/notification_db
      - GRPC_PORT=50057
      - IDENTITY_GRPC_ADDRESS=identity-service:50051
      - KAFKA_BROKERS=kafka:9092
    expose: ["50057"]
    depends_on:
      postgres: { condition: service_healthy }
      identity-service: { condition: service_healthy }
      kafka: { condition: service_healthy }
    networks: [internal]

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    restart: no
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/analytics_db
      - GRPC_PORT=50058
      - KAFKA_BROKERS=kafka:9092
    expose: ["50058"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    networks: [internal]

  # ── DATABASES & BROKERS ────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: no
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=512MB
        -c work_mem=16MB
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-cache:
    image: redis:7-alpine
    restart: no
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_cache_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.6
    restart: no
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_NODE_ID=1
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── UI & OBSERVABILITY ─────────────────────────────────────

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: no
    environment:
      - DYNAMIC_CONFIG_ENABLED=true
    depends_on:
      kafka: { condition: service_healthy }
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=tutoring-platform_internal"
      - "traefik.http.routers.kafka-ui.rule=Host(`kafka.localhost`)"
      - "traefik.http.services.kafka-ui.loadbalancer.server.port=8080"

  redis-exporter:
    image: oliver006/redis_exporter:latest
    restart: no
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - internal
    depends_on:
      redis: { condition: service_healthy }

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: no
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postgres?sslmode=disable"
    networks:
      - internal
    depends_on:
      postgres: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:latest
    restart: no
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=tutoring-platform_internal"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.localhost`)"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      - "traefik.http.routers.prometheus.middlewares=basic-auth@file"

  grafana:
    image: grafana/grafana:latest
    restart: no
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=http://grafana.localhost
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=tutoring-platform_internal"
      - "traefik.http.routers.grafana.rule=Host(`grafana.localhost`)"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
