name: tutoring-platform

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:

services:
  # ── API GATEWAY (EDGE) ─────────────────────────────────────
  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Traefik Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/certificates:ro
    networks:
      - public
      - internal

  # ── GRAPHQL API GATEWAY (BFF) ──────────────────────────────
  graphql-api:
    build: ./services/graphql-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis: { condition: service_healthy }
    networks:
      - public
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=tutoring-platform_public"
      # Весь GraphQL трафик идёт сюда
      - "traefik.http.routers.graphql.rule=Host(`api.localhost`) && PathPrefix(`/graphql`)"
      - "traefik.http.routers.graphql.middlewares=rate-limit@file,cors-headers@file"
      - "traefik.http.services.graphql.loadbalancer.server.port=4000"

  # ── BACKEND MICROSERVICES (gRPC) ───────────────────────────
  
  identity-service:
    build: ./services/identity-service
    restart: unless-stopped
    env_file: .env
    expose:
      - "50051" # gRPC port
      - "8000"  # HTTP port (healthchecks/metrics)
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      - internal

  catalog-service:
    build: ./services/catalog-service
    restart: unless-stopped
    env_file: .env
    expose:
      - "50051"
      - "8000"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
    networks:
      - internal

  scheduling-service:
    build: ./services/scheduling-service
    restart: unless-stopped
    env_file: .env
    expose:
      - "50051"
      - "8000"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
    networks:
      - internal

  booking-service:
    build: ./services/booking-service
    restart: unless-stopped
    env_file: .env
    expose:
      - "50051"
      - "8000"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
    networks:
      - internal

  payment-service:
    build: ./services/payment-service
    restart: unless-stopped
    env_file: .env
    expose:
      - "50051"
      - "8000"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
    networks:
      - internal

  review-service:
    build: ./services/review-service
    restart: unless-stopped
    env_file: .env
    expose:
      - "50051"
      - "8000"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
    networks:
      - internal

  notification-service:
    build: ./services/notification-service
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    depends_on:
      redis: { condition: service_healthy }
      kafka: { condition: service_started }
    networks:
      - internal

  analytics-service:
    build: ./services/analytics-service
    restart: unless-stopped
    env_file: .env
    expose:
      - "50051"
      - "8000"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
    networks:
      - internal

  # ── DATABASES & BROKERS ────────────────────────────────────
  
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=512MB
        -c work_mem=16MB
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.6
    restart: unless-stopped
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_NODE_ID=1
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── UI & OBSERVABILITY ─────────────────────────────────────
  
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    environment:
      - DYNAMIC_CONFIG_ENABLED=true
    depends_on:
      kafka: { condition: service_healthy }
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=tutoring-platform_internal"
      - "traefik.http.routers.kafka-ui.rule=Host(`kafka.localhost`)"
      - "traefik.http.services.kafka-ui.loadbalancer.server.port=8080"

  redis-exporter:
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - internal
    depends_on:
      redis: { condition: service_healthy }

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postgres?sslmode=disable"
    networks:
      - internal
    depends_on:
      postgres: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=tutoring-platform_internal"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.localhost`)"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      - "traefik.http.routers.prometheus.middlewares=basic-auth@file"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=http://grafana.localhost
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=tutoring-platform_internal"
      - "traefik.http.routers.grafana.rule=Host(`grafana.localhost`)"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
