[project]
name = "iisik"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.13.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "services/*",
    "packages/*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "*/migrations/*",
    "*/generated/*",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.lint.isort]
known-first-party = [
    "shared",
    "identity_service",
    "catalog_service",
    "scheduling_service",
    "booking_service",
    "payment_service",
    "review_service",
    "notification_service",
    "analytics_service",
    "graphql_api",
]
